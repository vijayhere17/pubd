services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pabd
      MYSQL_USER: pabd
      MYSQL_PASSWORD: pabd_secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - pabd_mysql:/var/lib/mysql

  backend:
    image: serversideup/php:8.3-fpm-nginx
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pabd
      DB_USERNAME: pabd
      DB_PASSWORD: pabd_secret
    ports:
      - "8000:8080"
    depends_on:
      - mysql

volumes:
  pabd_mysql:
